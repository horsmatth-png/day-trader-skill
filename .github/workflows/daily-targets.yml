name: Daily Price Targets & Level Analysis

on:
  schedule:
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

jobs:
  daily-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai yfinance requests groq

      - name: Compute Targets & Pivot Matrix
        run: |
          mkdir -p trader
          python3 trader-scanner/screen_targets.py

      - name: Run AI Target Projections & Execution Plan (Gemini + Groq Fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 trader-news/ai_analyze.py --focus target > ai_targets_out.txt 2>/dev/null || true
          sleep 3
          python3 trader-news/ai_analyze.py --focus execution > ai_execution_out.txt 2>/dev/null || true

      - name: Post Daily Targets to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi

          python3 - << 'EOF'
          import os
          import time
          import requests

          url = os.environ.get("DISCORD_WEBHOOK_URL")

          def send_msg(text):
              if not text.strip():
                  return
              requests.post(url, json={"content": text})
              time.sleep(1.5)

          def send_file_chunked(filename, header=""):
              if not os.path.exists(filename):
                  return
              with open(filename, "r") as f:
                  content = f.read().strip()
              if not content:
                  return

              lines = content.split("\n")
              current_chunk = header + "\n" if header else ""

              for line in lines:
                  if len(current_chunk) + len(line) + 1 > 1850:
                      send_msg(current_chunk)
                      current_chunk = line + "\n"
                  else:
                      current_chunk += line + "\n"

              if current_chunk.strip():
                  send_msg(current_chunk)

          # Part 1: Quantitative Target Matrix Table
          if os.path.exists("targets_out.txt"):
              with open("targets_out.txt", "r") as f:
                  t_summary = f.read().strip()
              send_msg(f"🎯 **Daily Target & Pivot Matrix**\n\n```\n{t_summary}\n```")

          # Part 2: Macro & Targets Overview
          send_file_chunked("ai_targets_out.txt")

          # Part 3: Tactical Execution Plan (Strict 2-Bullet Format per Ticker)
          send_file_chunked("ai_execution_out.txt")
          EOF
