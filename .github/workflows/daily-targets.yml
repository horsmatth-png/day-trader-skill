name: Daily Price Targets & Level Analysis

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

jobs:
  daily-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai yfinance

      - name: Compute Targets & Pivot Matrix
        run: |
          mkdir -p trader
          python3 trader-scanner/screen_targets.py

      - name: Run Gemini Target Projections
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 trader-news/ai_analyze.py --focus target > ai_targets_out.txt 2>/dev/null || true

      - name: Post Daily Targets to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi

          header="🎯 **Daily Target & Pivot Matrix ($(date '+%a %b %d'))**"
          target_summary=$(cat targets_out.txt 2>/dev/null | head -c 1700 || echo "No target data available")
          msg1=$(printf '%s\n\n```\n%s\n```' "$header" "$target_summary")
          jq -n --arg c "$msg1" '{content: $c}' | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
          sleep 1.5

          ai_report=$(cat ai_targets_out.txt 2>/dev/null | head -c 1800 || echo "No AI target analysis generated")
          jq -n --arg c "$ai_report" '{content: $c}' | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
