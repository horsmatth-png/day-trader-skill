name: Swing Investing & Macro Strategy

on:
  schedule:
    - cron: '0 12 * * 1'      # Mondays at 12:00 PM UTC
  workflow_dispatch:

jobs:
  swing-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai yfinance groq
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Swing Scanner & Fundamental Screening
        run: |
          mkdir -p trader
          
          # Technical scan
          python3 trader-scanner/scan.py swing > scan_out.txt 2>/dev/null || true
          
          if [ -s scan_out.txt ]; then
            cat scan_out.txt > trader/watchlist.json
          else
            echo "No scan data generated" > trader/watchlist.json
          fi

          # Fundamental screen
          python3 trader-scanner/screen_fundamentals.py

      - name: Run AI Macro & Value Prospect Analysis (Gemini + Groq Fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # 1. Macro Analysis
          python3 trader-news/ai_analyze.py --focus macro > ai_out.txt 2>/dev/null || true
          
          # 2. Fundamental Value & Forward Options Assessment
          python3 trader-news/ai_analyze.py --focus value > ai_value_out.txt 2>/dev/null || true

      - name: Post Swing & Fundamental Report to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi

          # Part 1: Technical Scan & Prices
          header="📈 **Swing Trading & Market Metrics ($(date '+%a %b %d'))**"
          scan_summary=$(cat scan_out.txt 2>/dev/null | head -c 1700 || echo "No scan data available")
          msg1=$(printf '%s\n\n```\n%s\n```' "$header" "$scan_summary")
          jq -n --arg c "$msg1" '{content: $c}' | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
          sleep 1.5

          # Part 2: Fundamental Valuation Screening Table
          fund_header="💎 **Broad Market Value & Valuation Prospects (P/E & P/S Filters)**"
          fund_summary=$(cat fundamentals_out.txt 2>/dev/null | head -c 1700 || echo "No fundamentals data available")
          msg2=$(printf '%s\n\n```\n%s\n```' "$fund_header" "$fund_summary")
          jq -n --arg c "$msg2" '{content: $c}' | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
          sleep 1.5

          # Part 3: AI Forward Value Assessment
          ai_val_report=$(cat ai_value_out.txt 2>/dev/null | head -c 1800 || echo "No value analysis generated")
          jq -n --arg c "$ai_val_report" '{content: $c}' | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
          sleep 1.5

          # Part 4: AI Macro Strategy Report
          ai_report=$(cat ai_out.txt 2>/dev/null | head -c 1800 || echo "No AI macro analysis generated")
          jq -n --arg c "$ai_report" '{content: $c}' | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
