name: Day Trading & ORB Scanner

on:
  schedule:
    - cron: '35 13 * * 1-5'    # 9:35 AM ET
    - cron: '50 13 * * 1-5'    # 9:50 AM ET
    - cron: '15 14 * * 1-5'    # 10:15 AM ET
  workflow_dispatch:

jobs:
  day-trading-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai yfinance
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Intraday & ORB Scanner
        run: |
          mkdir -p trader
          python3 scan.py orb > scan_out.txt 2>/dev/null || true
          # BRIDGE: Ensure scan output is written to trader/watchlist.json for Gemini
          if [ -s scan_out.txt ]; then
            cat scan_out.txt > trader/watchlist.json
          else
            echo "No scan data generated" > trader/watchlist.json
          fi

      - name: Run Gemini Day Trading Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 trader-news/ai_analyze.py > ai_out.txt 2>/dev/null || true

      - name: Post Day Trading Report to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi

          header="⚡ **Day Trading & ORB Setup Report ($(date '+%a %b %d'))**"
          scan_summary=$(cat scan_out.txt 2>/dev/null | head -c 1700 || echo "No scan data available")
          part1_msg=$(printf '%s\n\n```\n%s\n```' "$header" "$scan_summary")

          jq -n --arg c "$part1_msg" '{content: $c}' \
            | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

          sleep 1

          ai_report=$(cat ai_out.txt 2>/dev/null | head -c 1800 || echo "No AI analysis generated")
          jq -n --arg c "$ai_report" '{content: $c}' \
            | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
